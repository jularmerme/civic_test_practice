<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RATIFY - USCIS Civics Test Practice - 2025</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --gold: #C9973F;
        --dark-navy: #1B2A4A;
        --light-cream: #FAF7F0;
        --sage-green: #6B9080;
        --accent-gold: #D4A574;
        --light-bg: #F3ECDC;
        --border-light: #E4DDD0;
        --text-muted: #5C6B7A;
        --text-light: #8A96A3;
        --text-lighter: #D8DEE9;
        --error-red: #B85C4A;
        --dark-secondary: #28395F;
      }

      html.dark {
        --gold: #D4A574;
        --dark-navy: #0F1823;
        --light-cream: #1A1F2E;
        --sage-green: #5A7F6F;
        --accent-gold: #C9973F;
        --light-bg: #2A3145;
        --border-light: #3A4555;
        --text-muted: #B0B8C4;
        --text-light: #8A96A3;
        --text-lighter: #D8DEE9;
        --error-red: #E89080;
        --dark-secondary: #3C4D66;
      }

      html, body {
        font-family: 'Public Sans', 'Helvetica Neue', Arial, sans-serif;
        background-color: var(--light-cream);
        color: var(--dark-navy);
        line-height: 1.6;
      }

      /* ===== HEADER ===== */
      .header {
        background-color: var(--dark-navy);
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 80px;
        box-shadow: 0 6px 20px rgba(27, 42, 74, 0.1);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .seal {
        width: 32px;
        height: 32px;
        border: 2px solid var(--gold);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .seal-star {
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 9px solid var(--gold);
        position: relative;
      }

      .logo {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--light-cream);
        letter-spacing: 2px;
      }

      .nav-links {
        display: flex;
        gap: 48px;
        align-items: center;
      }

      .nav-link {
        color: var(--text-lighter);
        font-size: 15px;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition: color 0.3s ease;
        border: none;
        background: none;
        font-family: 'Public Sans', sans-serif;
      }

      .nav-link:hover {
        color: var(--light-cream);
      }

      .nav-link.active {
        color: var(--light-cream);
        font-weight: 600;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .dark-mode-toggle {
        width: 34px;
        height: 34px;
        background-color: var(--dark-secondary);
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .lang-select {
        border: 1.5px solid #4A5C82;
        background: transparent;
        color: var(--text-lighter);
        padding: 6px 12px;
        border-radius: 16px;
        font-size: 13px;
        cursor: pointer;
        font-family: 'Public Sans', sans-serif;
      }

      /* ===== HERO ===== */
      .hero {
        background: linear-gradient(180deg, #FAF7F0 0%, #F3ECDC 100%);
        padding: 80px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 80px;
        align-items: center;
        min-height: 560px;
      }

      .hero-content h3 {
        color: var(--gold);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2.5px;
        margin-bottom: 24px;
        text-transform: uppercase;
      }

      .hero-content h1 {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 44px;
        font-weight: 600;
        color: var(--dark-navy);
        line-height: 1.2;
        margin-bottom: 24px;
      }

      .hero-content p {
        color: var(--text-muted);
        font-size: 17px;
        margin-bottom: 32px;
        line-height: 1.6;
      }

      .cta-buttons {
        display: flex;
        gap: 24px;
      }

      .btn-primary {
        background-color: var(--gold);
        color: var(--dark-navy);
        padding: 16px 32px;
        border-radius: 10px;
        border: none;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Public Sans', sans-serif;
      }

      .btn-primary:hover {
        background-color: #B8863A;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(201, 151, 63, 0.2);
      }

      .btn-secondary {
        background-color: transparent;
        color: var(--dark-navy);
        padding: 14px 32px;
        border-radius: 10px;
        border: 1.5px solid var(--dark-navy);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Public Sans', sans-serif;
      }

      .btn-secondary:hover {
        background-color: var(--dark-navy);
        color: var(--light-cream);
      }

      /* Stamp element */
      .stamp-container {
        position: relative;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .stamp {
        width: 200px;
        height: 200px;
        border: 2.5px solid var(--dark-navy);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        transform: rotate(-8deg);
        box-shadow: 0 8px 32px rgba(27, 42, 74, 0.15);
      }

      .stamp::before {
        content: '';
        position: absolute;
        width: 160px;
        height: 160px;
        border: 1.5px dashed var(--gold);
        border-radius: 50%;
      }

      .stamp-content {
        position: relative;
        z-index: 1;
        text-align: center;
      }

      .stamp-number {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--dark-navy);
      }

      .stamp-label {
        font-size: 10.5px;
        letter-spacing: 2px;
        color: var(--text-muted);
        margin-top: 4px;
        text-transform: uppercase;
      }

      .stamp-arc-text {
        position: absolute;
        font-size: 12.5px;
        letter-spacing: 3px;
        color: var(--dark-navy);
        font-weight: 700;
        width: 100%;
        text-align: center;
      }

      /* ===== STATS SECTION ===== */
      .stats-section {
        padding: 0 80px;
        margin: -40px 0 0 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        position: relative;
        z-index: 10;
      }

      .stat-card {
        background: white;
        padding: 32px;
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(27, 42, 74, 0.1);
      }

      .stat-card.wide {
        grid-column: span 1;
      }

      .stat-label {
        color: var(--text-muted);
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .stat-value {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 34px;
        font-weight: 700;
        color: var(--dark-navy);
        margin-bottom: 12px;
      }

      .stat-value .fraction {
        color: var(--text-light);
        font-size: 18px;
      }

      .stat-bar {
        width: 100%;
        height: 6px;
        background: #EDE6D6;
        border-radius: 3px;
        overflow: hidden;
        margin-top: 12px;
      }

      .stat-bar-fill {
        height: 100%;
        background: #6B9080;
        border-radius: 3px;
      }

      .stat-description {
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 8px;
      }

      .stat-badge {
        display: inline-block;
        background: #EAF1EC;
        color: var(--sage-green);
        padding: 6px 12px;
        border-radius: 13px;
        font-size: 12px;
        font-weight: 700;
        margin-top: 8px;
      }

      /* ===== MODES SECTION ===== */
      .modes-section {
        padding: 80px;
      }

      .section-title {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 26px;
        font-weight: 600;
        color: var(--dark-navy);
        margin-bottom: 48px;
      }

      .modes-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 24px;
      }

      .mode-card {
        background: white;
        padding: 32px;
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(27, 42, 74, 0.1);
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
      }

      .mode-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 32px rgba(27, 42, 74, 0.15);
      }

      .mode-card.featured {
        background: var(--dark-navy);
        color: white;
        grid-column: span 1;
      }

      .mode-icon {
        width: 44px;
        height: 44px;
        background: var(--light-bg);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        font-size: 20px;
      }

      .mode-card.featured .mode-icon {
        background: var(--dark-secondary);
      }

      .mode-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--dark-navy);
      }

      .mode-card.featured .mode-title {
        color: white;
      }

      .mode-description {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 16px;
        flex-grow: 1;
      }

      .mode-card.featured .mode-description {
        color: #B7C0D1;
      }

      .mode-link {
        color: var(--gold);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: opacity 0.3s ease;
      }

      .mode-link:hover {
        opacity: 0.8;
      }

      .mode-card.featured .mode-link {
        margin-top: auto;
      }

      .featured-btn {
        background: var(--gold);
        color: var(--dark-navy);
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
        margin-top: 12px;
      }

      .featured-btn:hover {
        background: #B8863A;
      }

      /* ===== FOOTER ===== */
      .footer {
        padding: 48px 80px;
        border-top: 1px solid var(--border-light);
        margin-top: 80px;
      }

      .footer p {
        color: var(--text-light);
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 8px;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 1200px) {
        .hero {
          grid-template-columns: 1fr;
          padding: 60px;
        }

        .stamp-container {
          display: none;
        }

        .modes-grid {
          grid-template-columns: repeat(3, 1fr);
        }

        .mode-card.featured {
          grid-column: span 1;
        }
      }

      @media (max-width: 768px) {
        .header {
          padding: 0 24px;
          height: auto;
          flex-wrap: wrap;
        }

        .nav-links {
          gap: 24px;
          font-size: 13px;
        }

        .hero {
          padding: 40px 24px;
        }

        .hero-content h1 {
          font-size: 32px;
        }

        .stats-section {
          grid-template-columns: repeat(2, 1fr);
          padding: 0 24px;
        }

        .modes-grid {
          grid-template-columns: 1fr;
        }

        .mode-card.featured {
          grid-column: span 1;
        }

        .footer {
          padding: 32px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="data/questionUtils.js"></script>
    <script src="data/questions.js"></script>
    <script src="app.js"></script>

  </body>
</html>
